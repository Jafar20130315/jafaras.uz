<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jafar | 404 Not Found</title>
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Lenis for Smooth Scroll -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>

    <!-- Google Fonts: Inter (Body) + Outfit (Headings) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;700;900&display=swap" rel="stylesheet">

    <!-- Tailwind Config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#6366f1",
              secondary: "#a855f7",
              accent: "#06b6d4",
              dark: "#030305",
              card: "rgba(255, 255, 255, 0.03)",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ["Outfit", "sans-serif"],
            },
            animation: {
              'gradient-x': 'gradient-x 8s ease infinite',
            },
            keyframes: {
              'gradient-x': {
                '0%, 100%': { 'background-size': '200% 200%', 'background-position': 'left center' },
                '50%': { 'background-size': '200% 200%', 'background-position': 'right center' },
              }
            }
          },
        },
      };
    </script>

    <style>
      body {
        background-color: #030305;
        color: #e2e8f0;
        margin: 0;
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #030305; }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(to bottom, #6366f1, #06b6d4);
        border-radius: 10px;
      }

      @media (pointer: fine) { * { cursor: none !important; } }

      #bg-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        pointer-events: none;
      }

      .cursor-dot, .cursor-outline {
        position: fixed;
        top: 0;
        left: 0;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        z-index: 99999;
        pointer-events: none;
      }
      .cursor-dot {
        width: 6px; height: 6px; background-color: white;
        box-shadow: 0 0 10px rgba(255,255,255,0.8);
      }
      .cursor-outline {
        width: 34px; height: 34px; border: 1px solid rgba(255, 255, 255, 0.4);
        transition: width 0.2s, height 0.2s, background-color 0.2s;
        will-change: transform;
      }
      .cursor-outline.hovering {
        width: 50px; height: 50px; background-color: rgba(255, 255, 255, 0.1);
        border-color: transparent; backdrop-filter: blur(2px);
      }

      .nav-fly-in {
        opacity: 0;
        transform: translate3d(400px, 0, -800px) rotateY(-45deg);
        transition: transform 1.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 1.5s ease;
      }
      .hero-fly-in {
        opacity: 0;
        transform: translate3d(0, 150px, -800px) rotateX(30deg);
        transition: transform 2s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s, opacity 1.8s ease 0.3s;
      }
      body.loaded .nav-fly-in { opacity: 1; transform: translate3d(0, 0, 0) rotateY(0deg); }
      body.loaded .hero-fly-in { opacity: 1; transform: translate3d(0, 0, 0) rotateX(0deg); }

      .glass-card {
        background: rgba(20, 20, 25, 0.4);
        backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.01), 0 10px 30px -10px rgba(0,0,0,0.5);
        transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.15s ease-out;
        transform-style: preserve-3d;
      }

      .scene-3d { perspective: 1500px; transform-style: preserve-3d; }
      .layer-3d { transform-style: preserve-3d; will-change: transform; }

      .lang-btn {
        border: 1px solid rgba(255, 255, 255, 0.08); background: rgba(255, 255, 255, 0.02);
        color: #94a3b8; transition: all 0.3s ease;
      }
      .lang-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
      .lang-btn.active-lang { background: rgba(6, 182, 212, 0.15); border-color: rgba(6, 182, 212, 0.6); color: #fff; }

      /* Loader */
      #preloader {
        position: fixed; inset: 0; background-color: #030305; z-index: 10000;
        display: flex; justify-content: center; align-items: center;
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }
      .loader-container { display: flex; flex-direction: column; align-items: center; width: 80%; max-width: 400px; gap: 20px; }
      .loader-brand { font-family: 'Outfit', sans-serif; font-size: 2rem; font-weight: 900; letter-spacing: 0.1em; color: #fff; }
      .loader-brand span { color: #06b6d4; }
      .loader-track { width: 100%; height: 1px; background: rgba(255, 255, 255, 0.1); position: relative; }
      .loader-bar { position: absolute; top: -1px; left: 0; height: 3px; width: 0%; background: linear-gradient(90deg, transparent, #6366f1, #06b6d4); box-shadow: 0 0 15px #06b6d4; transition: width 0.1s linear; }
    </style>
  </head>

  <body>
    <!-- Preloader -->
    <div id="preloader">
      <div class="loader-container">
        <div class="loader-brand">JA'FAR<span>.</span></div>
        <div class="loader-track"><div class="loader-bar" id="loaderBar"></div></div>
      </div>
    </div>

    <!-- 3D Canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- Custom Cursor -->
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <!-- Navigation (Исправлена проблема с кликабельностью) -->
    <nav class="fixed w-full z-[9999] top-0 left-0 p-4 sm:p-6 nav-fly-in pointer-events-none" id="navbar">
      <div class="mx-auto max-w-6xl pointer-events-auto">
        <div class="glass-card rounded-2xl px-5 sm:px-8 py-3 sm:py-4 border border-white/5 bg-black/20" style="transform-style: flat;">
          <div class="flex justify-between items-center relative z-50">
            <div class="text-xl sm:text-2xl font-display font-bold tracking-widest text-white hover:text-accent transition duration-300 cursor-pointer" onclick="window.scrollTo(0,0)">
              JA'FAR<span class="text-accent">.</span>
            </div>

            <ul class="hidden md:flex space-x-8 text-sm font-medium text-gray-300">
              <li><a href="#about" class="hover:text-white transition" data-i18n="nav_about">Обо мне</a></li>
              <li><a href="#roadmap" class="hover:text-white transition" data-i18n="nav_goals">Цели</a></li>
              <li><a href="#projects" class="hover:text-white transition" data-i18n="nav_projects">Проекты</a></li>
              <li><a href="#contact" class="hover:text-white transition" data-i18n="nav_contact">Контакты</a></li>
            </ul>

            <div class="hidden md:flex items-center gap-2 ml-4 relative z-50">
              <button class="lang-btn active-lang text-xs font-bold px-3 py-1.5 rounded-full cursor-pointer" data-lang="ru">RU</button>
              <button class="lang-btn text-xs font-bold px-3 py-1.5 rounded-full cursor-pointer" data-lang="uz">UZ</button>
              <button class="lang-btn text-xs font-bold px-3 py-1.5 rounded-full cursor-pointer" data-lang="en">EN</button>
            </div>

            <button id="menuBtn" class="md:hidden inline-flex items-center justify-center w-10 h-10 rounded-full border border-white/10 hover:bg-white/10 transition text-white relative z-50 cursor-pointer">
              <i class="fas fa-bars"></i>
            </button>
          </div>

          <div id="mobileMenu" class="md:hidden hidden mt-4 border-t border-white/10 pt-4 relative z-50">
            <div class="flex flex-col gap-2">
              <div class="flex items-center justify-between px-2 pb-2">
                <div class="text-xs text-gray-500 uppercase tracking-widest" data-i18n="lang_label">Язык</div>
                <div class="flex gap-2">
                  <button class="lang-btn active-lang text-xs font-bold px-3 py-1.5 rounded-full cursor-pointer" data-lang="ru">RU</button>
                  <button class="lang-btn text-xs font-bold px-3 py-1.5 rounded-full cursor-pointer" data-lang="uz">UZ</button>
                  <button class="lang-btn text-xs font-bold px-3 py-1.5 rounded-full cursor-pointer" data-lang="en">EN</button>
                </div>
              </div>
              <a href="#about" class="px-4 py-3 rounded-xl hover:bg-white/5 transition text-gray-300" data-i18n="nav_about">Обо мне</a>
              <a href="#roadmap" class="px-4 py-3 rounded-xl hover:bg-white/5 transition text-gray-300" data-i18n="nav_goals">Цели</a>
              <a href="#projects" class="px-4 py-3 rounded-xl hover:bg-white/5 transition text-gray-300" data-i18n="nav_projects">Проекты</a>
              <a href="#contact" class="px-4 py-3 rounded-xl hover:bg-white/5 transition text-gray-300" data-i18n="nav_contact">Контакты</a>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <!-- 404 Hero Section -->
    <section class="min-h-screen flex items-center justify-center relative overflow-hidden text-center px-4 pt-20 scene-3d">
      <div class="z-10 layer-3d hero-fly-in pointer-events-none" data-intensity="5">
        <div class="inline-block mb-6 px-4 py-1.5 rounded-full border border-red-500/30 bg-red-500/10 backdrop-blur-md text-xs font-medium tracking-widest text-red-400 uppercase pointer-events-auto" data-i18n="404_tag" style="transform: translateZ(10px);">
          Error 404
        </div>
        <h1 class="text-7xl sm:text-9xl md:text-[12rem] font-display font-bold mb-6 tracking-tighter leading-none pointer-events-auto" style="transform: translateZ(30px); text-shadow: 0 10px 20px rgba(0,0,0,0.3);">
          <span class="text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-orange-500 to-yellow-500 animate-gradient-x">404</span>
        </h1>
        <p class="text-xl sm:text-2xl md:text-3xl text-gray-400 max-w-2xl mx-auto mb-12 font-light pointer-events-auto" data-i18n="404_desc" style="transform: translateZ(15px);">
         Этой страницы не существует или она вообще удалена.
        </p>
        <div class="flex justify-center gap-5 pointer-events-auto" style="transform: translateZ(20px);">
          <a href="/" class="bg-white text-black px-10 py-4 rounded-full font-medium hover:bg-gray-200 transition duration-300 shadow-[0_0_30px_rgba(255,255,255,0.2)]">
            <i class="fas fa-arrow-left mr-2"></i> <span data-i18n="btn_home">Переходить на главную страницу.</span>
          </a>
        </div>
      </div>
    </section>

    <!-- i18n Logic -->
    <script src="i18n.js"></script>

    <!-- Logic -->
    <script>
      // === Preloader Logic ===
      const preloader = document.getElementById("preloader");
      const loaderBar = document.getElementById("loaderBar");

      function finishLoading() {
        preloader.style.opacity = "0";
        preloader.style.visibility = "hidden";
        document.body.classList.add("loaded");
      }

      let width = 0;
      const interval = setInterval(() => {
        width += Math.random() * 5;
        if (width > 100) width = 100;
        loaderBar.style.width = width + "%";
        if (width >= 100) {
          clearInterval(interval);
          setTimeout(finishLoading, 400);
        }
      }, 30);

      // === Premium Cursor Logic ===
      const dot = document.querySelector('.cursor-dot');
      const outline = document.querySelector('.cursor-outline');
      
      if (matchMedia("(pointer:fine)").matches) {
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let outlineX = mouseX;
        let outlineY = mouseY;
        
        window.addEventListener('mousemove', (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
          dot.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
        });

        const animateCursor = () => {
          let distX = mouseX - outlineX;
          let distY = mouseY - outlineY;
          outlineX += distX * 0.15;
          outlineY += distY * 0.15;
          outline.style.transform = `translate(${outlineX}px, ${outlineY}px) translate(-50%, -50%)`;
          requestAnimationFrame(animateCursor);
        };
        animateCursor();

        const interactables = document.querySelectorAll('a, button');
        interactables.forEach(el => {
          el.addEventListener('mouseenter', () => outline.classList.add('hovering'));
          el.addEventListener('mouseleave', () => outline.classList.remove('hovering'));
        });

        document.addEventListener("mouseleave", () => { dot.style.opacity = "0"; outline.style.opacity = "0"; });
        document.addEventListener("mouseenter", () => { dot.style.opacity = "1"; outline.style.opacity = "1"; });
      } else {
        dot.style.display = 'none'; outline.style.display = 'none';
      }

      // === Mobile Menu Toggle ===
      const menuBtn = document.getElementById("menuBtn");
      const mobileMenu = document.getElementById("mobileMenu");

      menuBtn.addEventListener("click", () => mobileMenu.classList.toggle("hidden"));
      mobileMenu.querySelectorAll("a").forEach(a => a.addEventListener("click", () => mobileMenu.classList.add("hidden")));

      // === Smooth Scroll (Lenis) ===
      const lenis = new Lenis({
        duration: 1.5,
        easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
        direction: 'vertical',
        smoothWheel: true,
      });

      // === i18n logic (Basic fallback for 404) ===
      function applyLang(lang) {
        const dict = (window.I18N && window.I18N[lang]) ? window.I18N[lang] : null;
        document.documentElement.lang = lang === "uz" ? "uz" : lang;

        if (dict) {
          document.querySelectorAll("[data-i18n]").forEach((el) => {
            const key = el.getAttribute("data-i18n");
            if (dict[key] != null) el.innerHTML = dict[key];
          });
        }

        document.querySelectorAll(".lang-btn").forEach((b) => {
          b.classList.toggle("active-lang", b.getAttribute("data-lang") === lang);
        });

        localStorage.setItem("site_lang", lang);
      }
      applyLang(localStorage.getItem("site_lang") || "ru");
      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.addEventListener("click", () => applyLang(btn.getAttribute("data-lang")));
      });

      // === Awwwards-Level 3D Data Ocean (Three.js) ===
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x030305, 0.025);

      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({
        canvas: document.querySelector("#bg-canvas"),
        alpha: true,
        antialias: true,
      });

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const planeGeo = new THREE.PlaneGeometry(250, 150, 70, 40);
      
      const pointsMat = new THREE.PointsMaterial({ color: 0xef4444, size: 0.15, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending }); // Reddish for 404
      const points = new THREE.Points(planeGeo, pointsMat);
      points.rotation.x = -Math.PI / 2; points.position.y = -10;
      scene.add(points);

      const wireMat = new THREE.MeshBasicMaterial({ color: 0xf97316, wireframe: true, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending }); // Orange for 404
      const wire = new THREE.Mesh(planeGeo, wireMat);
      wire.rotation.x = -Math.PI / 2; wire.position.y = -10;
      scene.add(wire);

      const dustGeo = new THREE.BufferGeometry();
      const dustCount = 800;
      const dustPos = new Float32Array(dustCount * 3);
      for(let i=0; i<dustCount*3; i++) dustPos[i] = (Math.random() - 0.5) * 200;
      dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
      const dustMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.05, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending });
      const dust = new THREE.Points(dustGeo, dustMat);
      scene.add(dust);

      let mouseXRaw = 0, mouseYRaw = 0;
      let targetLayerX = 0, targetLayerY = 0;
      let currentLayerX = 0, currentLayerY = 0;

      window.addEventListener('mousemove', (e) => {
        mouseXRaw = (e.clientX - window.innerWidth / 2);
        mouseYRaw = (e.clientY - window.innerHeight / 2);
        targetLayerX = (e.clientX / window.innerWidth) - 0.5;
        targetLayerY = (e.clientY / window.innerHeight) - 0.5;
      });

      const clock = new THREE.Clock();

      function animateAll(time) {
        lenis.raf(time);
        const elapsedTime = clock.getElapsedTime() * 0.4;

        const pos = planeGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i); const y = pos.getY(i);
          const z = Math.sin(x * 0.05 + elapsedTime) * Math.cos(y * 0.05 + elapsedTime) * 4 + Math.sin(x * 0.1 - elapsedTime * 0.5) * 2;
          pos.setZ(i, z);
        }
        pos.needsUpdate = true;
        dust.rotation.y = elapsedTime * 0.1;

        camera.position.x += ((mouseXRaw * 0.008) - camera.position.x) * 0.05;
        camera.position.y += ((-scrollY * 0.005 - (mouseYRaw * 0.005)) - camera.position.y) * 0.05;
        camera.position.z += ((40 - scrollY * 0.015) - camera.position.z) * 0.05;
        camera.lookAt(0, -10, -20);

        currentLayerX += (targetLayerX - currentLayerX) * 0.08;
        currentLayerY += (targetLayerY - currentLayerY) * 0.08;

        document.querySelectorAll('.layer-3d').forEach(layer => {
          const intensity = layer.getAttribute('data-intensity') || 10;
          const rx = currentLayerY * -(intensity * 0.4);
          const ry = currentLayerX * (intensity * 0.4);
          layer.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
        });

        renderer.render(scene, camera);
        requestAnimationFrame(animateAll);
      }
      requestAnimationFrame(animateAll);

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
