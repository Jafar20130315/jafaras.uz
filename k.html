<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Bot CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col">

    <header class="glass-panel sticky top-0 z-50 shadow-lg px-4 md:px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-indigo-500 flex items-center justify-center font-bold text-xl shadow-lg shadow-indigo-500/50">🤖</div>
            <div>
                <h1 class="font-bold text-lg leading-tight">Holiday Bot CMS</h1>
                <p class="text-xs text-slate-400">Панель управления</p>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- КОЛОНКА 1: LIVE CHAT & ОТВЕТЫ -->
        <div class="space-y-6 flex flex-col h-full">
            
            <!-- Окно ручной отправки -->
            <div class="glass-panel rounded-2xl p-4 md:p-5 shadow-xl">
        
        <!-- КОЛОНКА 1: LIVE CHAT & ОТВЕТЫ -->
        <div class="space-y-6 flex flex-col h-full">
            
            <!-- Окно ручной отправки -->
            <div class="glass-panel rounded-2xl p-5 shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                        Live Chat
                    </h2>
                    <div id="replyBadge" class="hidden bg-indigo-500/20 text-indigo-300 text-xs px-2 py-1 rounded-md border border-indigo-500/30 flex items-center gap-2">
                        <span>Reply mode ID: <span id="replyIdDisplay" class="font-bold"></span></span>
                        <button onclick="cancelReply()" class="hover:text-white transition">✖</button>
                    </div>
                </div>
                
                <input type="hidden" id="replyId">
                <textarea id="manualMessage" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-4 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all h-28 mb-3 resize-none" placeholder="Напиши сообщение прямо сейчас. Можно использовать ${day}"></textarea>
                
                <button onclick="sendMessage()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-medium transition-all shadow-lg shadow-emerald-600/20 flex justify-center items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    Отправить в группу
                </button>
            </div>

            <!-- Входящие сообщения -->
            <div class="glass-panel rounded-2xl p-4 md:p-5 shadow-xl flex-grow flex flex-col h-[300px] md:h-[400px]">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold flex items-center gap-2">
                        📥 Входящие реплаи
                    </h2>
                    <button onclick="loadMessages()" class="text-sm text-slate-400 hover:text-white transition-colors p-1">Обновить</button>
                </div>
                <div id="messagesList" class="flex-grow overflow-y-auto space-y-3 pr-2">
                    <div class="text-slate-500 text-sm text-center mt-10">Загрузка...</div>
                </div>
            </div>
        </div>

        <!-- КОЛОНКА 2: КОНТЕНТ ПЛАН (КАЛЕНДАРЬ) -->
        <div class="glass-panel rounded-2xl p-4 md:p-5 shadow-xl flex flex-col h-full">
            <h2 class="text-lg font-semibold mb-1 flex items-center gap-2">
                🗓 Контент-План
            </h2>
            <p class="text-xs text-slate-400 mb-6">Запланируй сообщения на конкретные дни. Если на сегодня ничего нет, бот отправит случайную фразу.</p>
            
            <!-- Форма планирования -->
            <div class="bg-slate-800/40 border border-slate-700 rounded-xl p-4 mb-6">
                <div class="grid grid-cols-2 gap-4 mb-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Дата</label>
                        <input type="date" id="planDate" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 color-scheme-dark">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Время отправки</label>
                        <div class="flex gap-2 items-center">
                            <input type="time" id="planTime" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 disabled:opacity-50">
                            <label class="flex items-center gap-1 text-xs cursor-pointer">
                                <input type="checkbox" id="planRandomTime" class="rounded bg-slate-900 border-slate-700 text-indigo-500 focus:ring-indigo-500" checked onchange="toggleTimeInput()">
                                RND
                            </label>
                        </div>
                    </div>
                </div>
                <textarea id="planText" class="w-full bg-slate-900/50 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500 transition-all h-20 mb-3 resize-none" placeholder="Текст запланированного сообщения. Пример: ${day} дней до школы!"></textarea>
                <button onclick="saveSchedule()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2 rounded-lg font-medium transition-all shadow-lg shadow-indigo-600/20">Запланировать на этот день</button>
            </div>

            <!-- Список запланированного -->
            <h3 class="text-sm font-semibold mb-3 text-slate-300 border-b border-slate-700 pb-2">Запланированные посты:</h3>
            <div id="scheduleList" class="flex-grow overflow-y-auto space-y-2 pr-2">
                <div class="text-slate-500 text-sm text-center mt-4">План пуст. Работает автопилот.</div>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 text-white px-6 py-3 rounded-xl shadow-2xl border-l-4 z-50 flex items-center gap-3">
        <span id="toastIcon"></span>
        <span id="toastMsg" class="text-sm font-medium"></span>
    </div>

    <script>
        // === НАСТРОЙКИ БОТА ===
        // Вставь сюда свой URL воркера и секретный токен!
        const BOT_CONFIG = {
            workerUrl: 'https://kayfiyat-kotaruvchi-bot.windowsnoutbook.workers.dev', // Укажи свой URL без '/' на конце
            adminToken: 'vbn20130315' // Укажи свой токен
        };

        // Принудительно темная тема для input[type="date"]
        document.querySelectorAll('input[type="date"], input[type="time"]').forEach(el => {
            el.style.colorScheme = "dark";
        });

        document.addEventListener("DOMContentLoaded", () => {
            // Устанавливаем дату в планировщике на завтра по умолчанию
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('planDate').value = tomorrow.toISOString().split('T')[0];
            
            toggleTimeInput();

            // Автоматическая инициализация (если настройки изменены с дефолтных)
            if (BOT_CONFIG.workerUrl !== 'https://твой-воркер.workers.dev') {
                initApp(false);
            } else {
                showToast('Настройте URL и Token в коде (BOT_CONFIG)!', 'error');
            }
        });

        function toggleTimeInput() {
            const isRandom = document.getElementById('planRandomTime').checked;
            document.getElementById('planTime').disabled = isRandom;
            if(isRandom) document.getElementById('planTime').value = '';
        }

        function getAuthHeaders() {
            return {
                "Authorization": `Bearer ${BOT_CONFIG.adminToken}`,
                "Content-Type": "application/json"
            };
        }

        async function initApp(showNotice = true) {
            if (showNotice) showToast('Подключение...', 'info');
            
            await loadMessages();
            await loadSchedule();
            
            if (showNotice) showToast('Подключено успешно', 'success');
        }

        /* LIVE CHAT ЛОГИКА */
        async function loadMessages() {
            const url = BOT_CONFIG.workerUrl;
            if (!url || url === 'https://твой-воркер.workers.dev') return;
            try {
                const res = await fetch(`${url}/api/messages`, { headers: getAuthHeaders() });
                if (!res.ok) throw new Error('Ошибка сети');
                const messages = await res.json();
                
                const list = document.getElementById('messagesList');
                list.innerHTML = '';
                
                if (messages.length === 0) {
                    list.innerHTML = '<div class="text-slate-500 text-sm text-center mt-10">Нет сообщений</div>';
                    return;
                }

                messages.forEach(msg => {
                    const date = new Date(msg.date).toLocaleString('ru-RU', { hour: '2-digit', minute:'2-digit', day:'2-digit', month:'2-digit' });
                    const div = document.createElement('div');
                    div.className = 'bg-slate-800/60 p-3 rounded-xl border border-slate-700 hover:border-indigo-500 transition-colors cursor-pointer group relative';
                    div.innerHTML = `
                        <div class="flex justify-between items-start mb-1">
                            <span class="font-bold text-indigo-400 text-sm">${msg.user}</span>
                            <span class="text-xs text-slate-500">${date}</span>
                        </div>
                        <div class="text-sm text-slate-300 break-words">${msg.text}</div>
                        <div class="absolute inset-0 bg-indigo-500/10 opacity-0 lg:group-hover:opacity-100 transition-opacity rounded-xl flex items-center justify-center pointer-events-none">
                            <span class="bg-indigo-600 text-white text-xs px-3 py-1 rounded-full shadow-lg hidden lg:block">Ответить</span>
                        </div>
                    `;
                    div.onclick = () => {
                        setReply(msg.id, msg.user);
                        window.scrollTo({ top: 0, behavior: 'smooth' }); // Прокрутка к форме на мобильных
                    };
                    list.appendChild(div);
                });
            } catch (e) {
                console.error(e);
            }
        }

        function setReply(id, user) {
            document.getElementById('replyId').value = id;
            document.getElementById('replyIdDisplay').innerText = id;
            document.getElementById('replyBadge').classList.remove('hidden');
            const textarea = document.getElementById('manualMessage');
            textarea.placeholder = `Ответ для ${user}...`;
            textarea.focus();
        }

        function cancelReply() {
            document.getElementById('replyId').value = '';
            document.getElementById('replyBadge').classList.add('hidden');
            document.getElementById('manualMessage').placeholder = "Напиши сообщение прямо сейчас. Можно использовать ${day}";
        }

        async function sendMessage() {
            const url = BOT_CONFIG.workerUrl;
            const text = document.getElementById('manualMessage').value;
            const replyId = document.getElementById('replyId').value;
            
            if (!text) return showToast('Введите текст', 'error');

            const btn = event.currentTarget;
            btn.innerHTML = `<span class="animate-spin text-xl leading-none">⏳</span> Отправка...`;
            
            try {
                const body = { text: text };
                if (replyId) body.reply_to_message_id = parseInt(replyId);

                const res = await fetch(`${url}/api/send`, { method: 'POST', headers: getAuthHeaders(), body: JSON.stringify(body) });
                if (res.ok) {
                    showToast('Отправлено!', 'success');
                    document.getElementById('manualMessage').value = '';
                    cancelReply();
                } else throw new Error();
            } catch (e) {
                showToast('Ошибка отправки', 'error');
            } finally {
                btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg> Отправить в группу`;
            }
        }

        /* КОНТЕНТ-ПЛАН ЛОГИКА */
        async function loadSchedule() {
            const url = BOT_CONFIG.workerUrl;
            if (!url) return;
            try {
                const res = await fetch(`${url}/api/schedule`, { headers: getAuthHeaders() });
                const schedule = await res.json();
                
                const list = document.getElementById('scheduleList');
                list.innerHTML = '';
                
                const dates = Object.keys(schedule).sort();
                
                if (dates.length === 0) {
                    list.innerHTML = '<div class="text-slate-500 text-sm text-center mt-4">План пуст. Работает автопилот.</div>';
                    return;
                }

                dates.forEach(date => {
                    const data = schedule[date];
                    const div = document.createElement('div');
                    const isPast = new Date(date) < new Date(new Date().setHours(0,0,0,0));
                    
                    div.className = `p-3 rounded-xl border border-slate-700 flex justify-between items-start gap-3 ${isPast || data.sent ? 'bg-slate-800/30 opacity-60' : 'bg-slate-800/80'}`;
                    
                    div.innerHTML = `
                        <div class="flex-grow">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="font-semibold text-sm ${data.sent ? 'text-slate-400' : 'text-indigo-400'}">${date}</span>
                                <span class="text-xs px-2 py-0.5 rounded bg-slate-700 text-slate-300 border border-slate-600">${data.time === 'random' ? 'Random' : data.time}</span>
                                ${data.sent ? '<span class="text-xs text-green-400 bg-green-400/10 px-2 py-0.5 rounded border border-green-400/20">Отправлено</span>' : ''}
                            </div>
                            <div class="text-sm text-slate-300 line-clamp-2" title="${data.text}">${data.text}</div>
                        </div>
                        <button onclick="deleteSchedule('${date}')" class="text-slate-500 hover:text-red-400 transition-colors p-1" title="Удалить">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    `;
                    list.appendChild(div);
                });
            } catch (e) {
                console.error('Ошибка загрузки расписания', e);
            }
        }

        async function saveSchedule() {
            const url = BOT_CONFIG.workerUrl;
            const date = document.getElementById('planDate').value;
            const isRandom = document.getElementById('planRandomTime').checked;
            const time = isRandom ? "random" : document.getElementById('planTime').value;
            const text = document.getElementById('planText').value;

            if (!date || !text) return showToast('Укажите дату и текст', 'error');
            if (!isRandom && !time) return showToast('Укажите время', 'error');

            try {
                const res = await fetch(`${url}/api/schedule`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ date, time, text })
                });
                
                if (res.ok) {
                    showToast('Запланировано!', 'success');
                    document.getElementById('planText').value = '';
                    loadSchedule(); 
                }
            } catch (e) {
                showToast('Ошибка сохранения', 'error');
            }
        }

        async function deleteSchedule(date) {
            if(!confirm(`Удалить план на ${date}?`)) return;
            const url = BOT_CONFIG.workerUrl;
            try {
                const res = await fetch(`${url}/api/schedule/${date}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });
                if (res.ok) {
                    showToast('Удалено', 'success');
                    loadSchedule();
                }
            } catch (e) {
                showToast('Ошибка удаления', 'error');
            }
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const msg = document.getElementById('toastMsg');
            
            msg.innerText = message;
            
            if (type === 'error') {
                toast.className = `fixed bottom-5 right-5 transform transition-all duration-300 px-6 py-3 rounded-xl shadow-2xl border-l-4 z-50 flex items-center gap-3 bg-red-900/90 border-red-500 text-red-100 translate-y-0 opacity-100`;
                icon.innerHTML = '⚠️';
            } else if (type === 'info') {
                toast.className = `fixed bottom-5 right-5 transform transition-all duration-300 px-6 py-3 rounded-xl shadow-2xl border-l-4 z-50 flex items-center gap-3 bg-indigo-900/90 border-indigo-500 text-indigo-100 translate-y-0 opacity-100`;
                icon.innerHTML = 'ℹ️';
            } else {
                toast.className = `fixed bottom-5 right-5 transform transition-all duration-300 px-6 py-3 rounded-xl shadow-2xl border-l-4 z-50 flex items-center gap-3 bg-emerald-900/90 border-emerald-500 text-emerald-100 translate-y-0 opacity-100`;
                icon.innerHTML = '✅';
            }
            
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
