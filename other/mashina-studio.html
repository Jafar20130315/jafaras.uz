<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surveillance Pro - Broadcast Studio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        /* Премиальная профессиональная тема (Obsidian & Accent) */
        :root {
            --bg-main: #141417; 
            --surface: #1e1e24; 
            --surface-hover: #2a2a32;
            --border: #33333b;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            
            --accent: #4f46e5; 
            --accent-hover: #4338ca;
            --danger: #e11d48; 
            --success: #059669;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            width: 100%; height: 100%;
            overflow: hidden; 
        }

        .hidden { display: none !important; }
        
        /* Кнопки и инпуты */
        button {
            padding: 10px 18px; border: 1px solid transparent; border-radius: 8px;
            font-family: inherit; font-weight: 500; font-size: 0.9rem; cursor: pointer;
            transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            user-select: none;
        }
        button:active { transform: translateY(1px); }
        .btn-primary { background: var(--accent); color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2); }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-secondary { background: var(--surface); border-color: var(--border); color: var(--text-main); }
        .btn-secondary:hover { background: var(--surface-hover); }
        
        input {
            width: 100%; padding: 12px 16px; border-radius: 8px;
            background: rgba(0,0,0,0.2); border: 1px solid var(--border);
            color: white; font-size: 1rem; outline: none; transition: 0.2s;
            font-family: inherit;
        }
        input:focus { border-color: var(--accent); background: rgba(0,0,0,0.4); }

        /* Всплывающие уведомления (Toasts) */
        #toast-container {
            position: fixed; bottom: 24px; right: 24px; z-index: 9999;
            display: flex; flex-direction: column; gap: 12px; pointer-events: none;
        }
        .toast {
            padding: 14px 20px; border-radius: 10px; color: white; font-size: 0.9rem; font-weight: 500;
            background: var(--surface); border: 1px solid var(--border);
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 12px; max-width: 380px; pointer-events: auto;
        }
        .toast.error { border-left: 4px solid var(--danger); }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.info { border-left: 4px solid var(--accent); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Экран Авторизации */
        #auth-view { height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, #1e1e24 0%, #141417 100%); }
        .login-card {
            background: rgba(30, 30, 36, 0.7); backdrop-filter: blur(20px);
            padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); width: 100%; max-width: 420px;
        }
        .login-card h1 { font-size: 1.7rem; font-weight: 600; text-align: center; margin-bottom: 8px; letter-spacing: -0.5px; }
        .login-card p { color: var(--text-muted); text-align: center; margin-bottom: 20px; font-size: 0.95rem; }
        
        /* Вкладки на экране входа */
        .tabs-header { display: flex; gap: 10px; margin-bottom: 25px; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 10px; border: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 10px; border-radius: 6px; border: none; background: transparent; color: var(--text-muted); font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background: var(--surface); color: white; box-shadow: 0 2px 8px rgba(0,0,0,0.2); border: 1px solid var(--border); }
        
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
        .auth-action-btn { width: 100%; padding: 14px; margin-top: 10px; font-size: 1rem; }

        /* Мобильный вид (Камера) */
        #mobile-view { height: 100vh; position: relative; background: #000; }
        #local-video { width: 100%; height: 100%; object-fit: cover; }
        .camera-overlay {
            position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px; pointer-events: none;
        }
        .status-badge {
            background: rgba(20,20,23,0.85); padding: 8px 16px; border-radius: 30px;
            backdrop-filter: blur(10px); font-size: 0.85rem; font-weight: 500; display: inline-flex; align-items: center; gap: 8px;
            border: 1px solid rgba(255,255,255,0.1); pointer-events: auto;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
        .dot-live { background: var(--danger); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.7); } 70% { opacity: 0.8; box-shadow: 0 0 0 6px rgba(225, 29, 72, 0); } 100% { opacity: 1; } }
        
        /* Поле переименования на камере */
        .mobile-name-input {
            pointer-events: auto; background: rgba(20,20,23,0.85); border: 1px solid rgba(255,255,255,0.1); 
            backdrop-filter: blur(10px); color: white; padding: 8px 16px; border-radius: 30px; font-size: 0.9rem;
            font-weight: 500; width: 160px; text-align: center; transition: 0.2s;
        }
        .mobile-name-input:focus { width: 220px; border-color: var(--accent); }

        .mobile-controls { pointer-events: auto; display: flex; justify-content: center; }
        #sleep-overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; align-items: center; justify-content: center; color: #222; }

        /* ПАНЕЛЬ УПРАВЛЕНИЯ (Студия) */
        #desktop-view { padding: 20px; height: 100vh; display: flex; flex-direction: column; gap: 20px; }
        
        /* Верхний бар */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--surface); padding: 16px 24px; border-radius: 14px;
            border: 1px solid var(--border); flex-shrink: 0;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .room-details h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 2px; }
        .room-details span { color: var(--text-muted); font-size: 0.85rem; }
        .action-group { display: flex; gap: 12px; }

        /* Основная рабочая область */
        .workspace { display: flex; gap: 20px; flex: 1; min-height: 0; }
        
        /* Левая часть: Эфир и Микшер */
        .mixer-section { flex: 1; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
        
        /* Главный монитор (Эфир) */
        .monitor-container {
            flex: 1; position: relative; background: #000; border-radius: 14px;
            border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
        }
        #program-canvas { max-width: 100%; max-height: 100%; object-fit: contain; aspect-ratio: 16/9; }
        .monitor-label {
            position: absolute; top: 20px; left: 20px; padding: 6px 14px; border-radius: 6px;
            font-size: 0.85rem; font-weight: 600; z-index: 10; letter-spacing: 0.5px;
        }
        .label-program { background: rgba(30,30,36,0.8); color: white; border: 1px solid var(--border); backdrop-filter: blur(5px); }
        .label-live { background: var(--danger); color: white; box-shadow: 0 2px 10px rgba(225, 29, 72, 0.4); animation: pulse 2s infinite; }

        /* Лента камер (Микшер) */
        .thumbnails-tray {
            height: 180px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
            padding: 12px; display: flex; gap: 12px; overflow-x: auto; flex-shrink: 0; outline: none;
        }
        .thumbnails-tray::-webkit-scrollbar { height: 6px; }
        .thumbnails-tray::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        
        .cam-card {
            width: 240px; height: 100%; background: var(--bg-main); border-radius: 10px; overflow: hidden;
            border: 2px solid transparent; display: flex; flex-direction: column;
            cursor: pointer; transition: 0.2s ease; position: relative;
        }
        .cam-card:hover { border-color: var(--border); }
        .cam-card.active { border-color: var(--danger); box-shadow: 0 0 0 2px rgba(225, 29, 72, 0.2); }
        
        /* Индикатор горячей клавиши */
        .hotkey-badge {
            position: absolute; top: 8px; left: 8px; z-index: 10;
            background: rgba(0,0,0,0.7); color: white; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px; padding: 2px 8px; font-family: monospace; font-size: 13px; font-weight: bold;
            backdrop-filter: blur(4px);
        }

        .cam-feed { flex: 1; background: #050505; position: relative; }
        .cam-feed video { width: 100%; height: 100%; object-fit: contain; }
        .cam-info { 
            padding: 6px 8px; background: var(--surface); border-top: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        /* Редактируемое имя в панели ПК */
        .editable-cam-name {
            background: transparent; border: 1px solid transparent; color: var(--text-main);
            font-size: 0.85rem; font-weight: 500; padding: 4px 6px; width: 100%; border-radius: 4px;
            transition: 0.2s; font-family: inherit;
        }
        .editable-cam-name:hover { background: rgba(255,255,255,0.05); border-color: var(--border); }
        .editable-cam-name:focus { background: var(--bg-main); border-color: var(--accent); outline: none; }

        /* Правая часть: Записи */
        .sidebar {
            width: 320px; background: var(--surface); border-radius: 14px; padding: 20px;
            border: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0;
        }
        .sidebar-header { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .sidebar-header h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 4px; }
        .sidebar-header p { font-size: 0.8rem; color: var(--text-muted); }
        
        .records-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .record-item {
            background: var(--bg-main); padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 8px; transition: 0.2s;
        }
        .record-item:hover { border-color: var(--accent); }
        .record-meta { display: flex; justify-content: space-between; align-items: center; }
        .record-title { font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .record-time { font-size: 0.75rem; color: var(--text-muted); }
        .record-item a { 
            background: rgba(79, 70, 229, 0.1); color: var(--accent); text-decoration: none; 
            font-size: 0.85rem; font-weight: 500; padding: 6px 0; text-align: center; border-radius: 6px; 
        }
        .record-item a:hover { background: var(--accent); color: white; }

        /* SVG Иконки */
        .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <!-- ЭКРАН ВХОДА -->
    <div id="auth-view">
        <div class="login-card">
            <h1>Broadcast Studio</h1>
            <p>Защищенная среда видеонаблюдения</p>
            
            <div class="tabs-header">
                <button class="tab-btn active" id="tab-btn-viewer" onclick="app.switchTab('viewer')">Панель управления</button>
                <button class="tab-btn" id="tab-btn-camera" onclick="app.switchTab('camera')">Камера</button>
            </div>

            <!-- Форма Режиссера (Viewer) -->
            <div id="form-viewer">
                <div class="input-group">
                    <label>ID Сеанса (Комната)</label>
                    <input type="text" id="v-room-id" placeholder="Например: studio01" value="studio01">
                </div>
                <div class="input-group">
                    <label>Пароль Режиссера</label>
                    <input type="password" id="v-pass" placeholder="Пароль для пульта" value="admin123">
                </div>
                <div class="input-group">
                    <label>Пароль для Камер <span style="color:var(--text-muted); font-size:0.75rem;">(Если создаете новую)</span></label>
                    <input type="text" id="v-cam-pass" placeholder="Придумайте пароль для источников" value="cam123">
                </div>
                <button class="btn-primary auth-action-btn" onclick="app.loginViewer()">
                    <svg class="icon"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                    Войти в Пульт
                </button>
            </div>

            <!-- Форма Камеры (Camera) -->
            <div id="form-camera" class="hidden">
                <div class="input-group">
                    <label>ID Сеанса (Куда подключаться)</label>
                    <input type="text" id="c-room-id" placeholder="Например: studio01" value="studio01">
                </div>
                <div class="input-group">
                    <label>Пароль Камеры</label>
                    <input type="password" id="c-pass" placeholder="Выданный режиссером пароль" value="cam123">
                </div>
                <div class="input-group">
                    <label>Название Камеры</label>
                    <input type="text" id="c-name" placeholder="Например: Холл, Зал..." value="Камера 1">
                </div>
                <button class="btn-primary auth-action-btn" style="background: var(--surface-light); border: 1px solid var(--border);" onclick="app.loginCamera()">
                    <svg class="icon"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                    Подключить Камеру
                </button>
            </div>
        </div>
    </div>

    <!-- РЕЖИМ КАМЕРЫ -->
    <div id="mobile-view" class="hidden">
        <video id="local-video" autoplay playsinline muted></video>
        <div class="camera-overlay">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; pointer-events: auto;">
                <div style="display:flex; flex-direction: column; gap: 10px;">
                    <div class="status-badge" id="cam-status">
                        <div class="status-dot"></div> Ожидание сигнала
                    </div>
                    <!-- Поле для переименования прямо на камере -->
                    <input type="text" id="mobile-cam-name" class="mobile-name-input" 
                           onblur="app.cameraMode.renameCamera(this.value)" 
                           onkeydown="if(event.key==='Enter') this.blur()">
                </div>
                <div class="status-badge hidden" id="rec-indicator" style="border-color: rgba(225,29,72,0.5); color: #fff;">
                    <div class="status-dot dot-live"></div> ЭФИР
                </div>
            </div>
            <div class="mobile-controls">
                <button class="btn-secondary" style="background: rgba(30,30,36,0.9); backdrop-filter: blur(10px);" onclick="app.cameraMode.toggleSleep()">
                    <svg class="icon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg> Затемнить экран
                </button>
            </div>
        </div>
        <div id="sleep-overlay" class="hidden" onclick="app.cameraMode.toggleSleep()">
            <span style="color:#444;">Коснитесь для пробуждения</span>
        </div>
    </div>

    <!-- РЕЖИССЕРСКИЙ ПУЛЬТ -->
    <div id="desktop-view" class="hidden">
        <div class="top-bar">
            <div class="brand">
                <div class="brand-icon">
                    <svg class="icon" style="color: white; width: 16px; height: 16px;"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                </div>
                <div class="room-details">
                    <h2>Рабочее пространство</h2>
                    <span id="desktop-room-name">Сеанс: - | Управление: Цифры 1-9 или клик</span>
                </div>
            </div>
            <div class="action-group">
                <button class="btn-primary" id="btn-record-mix" onclick="app.viewerMode.toggleMasterRecord()">
                    <svg class="icon"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg> Записать Эфир
                </button>
                <button class="btn-secondary" style="color: var(--danger); border-color: rgba(225,29,72,0.3);" onclick="app.viewerMode.deleteRoom()">
                    <svg class="icon"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg> Завершить сеанс
                </button>
            </div>
        </div>

        <div class="workspace">
            <div class="mixer-section">
                <div class="monitor-container">
                    <div class="monitor-label label-program" id="live-badge">ПРОГРАММА (Ожидание)</div>
                    <canvas id="program-canvas" width="1280" height="720"></canvas>
                </div>
                <div class="thumbnails-tray" id="cameras-grid" tabindex="0">
                    <!-- Карточки камер -->
                </div>
            </div>
            
            <div class="sidebar">
                <div class="sidebar-header">
                    <h3>Мастер-записи</h3>
                    <p>Локально сведенные файлы (.webm)</p>
                </div>
                <div class="records-list" id="recordings-list">
                    <p style="color:var(--text-muted); font-size:0.85rem; text-align:center; margin-top: 20px;">Нет доступных записей.</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, getDocs, onSnapshot, collection, addDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA79oUjY6YAZ9-S34Sj16k5qllxXB4HaXk",
            authDomain: "kuzatuv-kamerasi.firebaseapp.com",
            projectId: "kuzatuv-kamerasi",
            storageBucket: "kuzatuv-kamerasi.firebasestorage.app",
            messagingSenderId: "849973167598",
            appId: "1:849973167598:web:b469ee80ce412c0933faff"
        };

        const fbApp = initializeApp(firebaseConfig);
        const auth = getAuth(fbApp);
        const db = getFirestore(fbApp);

        const rtcConfig = { iceServers: [{ urls: ["stun:stun.l.google.com:19302"] }] };

        const app = {
            roomId: null,
            userId: null,
            
            showToast(message, type = 'info') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                let iconStr = '';
                if (type === 'error') iconStr = `<svg class="icon" style="color:var(--danger)"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;
                else if (type === 'success') iconStr = `<svg class="icon" style="color:var(--success)"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;
                else iconStr = `<svg class="icon" style="color:var(--accent)"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`;
                toast.innerHTML = `${iconStr} <span>${message}</span>`;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.animation = 'fadeOut 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards';
                    setTimeout(() => toast.remove(), 300);
                }, 4000);
            },

            switchTab(tab) {
                document.getElementById('form-viewer').classList.add('hidden');
                document.getElementById('form-camera').classList.add('hidden');
                document.getElementById('tab-btn-viewer').classList.remove('active');
                document.getElementById('tab-btn-camera').classList.remove('active');
                
                document.getElementById(`form-${tab}`).classList.remove('hidden');
                document.getElementById(`tab-btn-${tab}`).classList.add('active');
            },

            async loginViewer() {
                this.roomId = document.getElementById('v-room-id').value.trim();
                const vPass = document.getElementById('v-pass').value.trim();
                const cPass = document.getElementById('v-cam-pass').value.trim();
                
                if (!this.roomId || !vPass) return this.showToast("Введите ID комнаты и пароль", "error");

                try {
                    const userCred = await signInAnonymously(auth);
                    this.userId = userCred.user.uid;

                    const roomRef = doc(db, "rooms", this.roomId);
                    const roomSnap = await getDoc(roomRef);

                    if (roomSnap.exists()) {
                        const roomData = roomSnap.data();
                        if (roomData.viewerPassword !== vPass) return this.showToast("Неверный пароль режиссера!", "error");
                        if (roomData.viewerId && roomData.viewerId !== this.userId) {
                            return this.showToast("В сеансе уже работает другой режиссер.", "error");
                        }
                    } else {
                        if (!cPass) return this.showToast("При создании новой комнаты задайте пароль для камер!", "error");
                        await setDoc(roomRef, { 
                            viewerPassword: vPass, 
                            cameraPassword: cPass, 
                            createdAt: Date.now(), 
                            globalCommand: null, 
                            viewerId: this.userId 
                        });
                    }

                    if (roomSnap.exists() && !roomSnap.data().viewerId) {
                        await updateDoc(roomRef, { viewerId: this.userId });
                    }

                    document.getElementById('auth-view').classList.add('hidden');
                    this.showToast(`Сеанс "${this.roomId}" успешно начат`, "success");

                    document.getElementById('desktop-view').classList.remove('hidden');
                    document.getElementById('desktop-room-name').innerText = `Сеанс: ${this.roomId} | Управление: Цифры 1-9 или клик`;
                    this.viewerMode.init();
                } catch (error) {
                    this.showToast("Ошибка соединения с сервером.", "error");
                }
            },

            async loginCamera() {
                this.roomId = document.getElementById('c-room-id').value.trim();
                const cPass = document.getElementById('c-pass').value.trim();
                const cName = document.getElementById('c-name').value.trim() || `Камера ${Math.floor(Math.random() * 100)}`;
                
                if (!this.roomId || !cPass) return this.showToast("Введите ID комнаты и пароль камеры", "error");

                try {
                    const roomRef = doc(db, "rooms", this.roomId);
                    const roomSnap = await getDoc(roomRef);

                    if (!roomSnap.exists()) return this.showToast("Комната не найдена. Сначала создайте ее в Пульте ТВ.", "error");
                    if (roomSnap.data().cameraPassword !== cPass) return this.showToast("Неверный пароль камеры!", "error");

                    const userCred = await signInAnonymously(auth);
                    this.userId = userCred.user.uid;

                    document.getElementById('auth-view').classList.add('hidden');
                    this.showToast(`Подключение к ${this.roomId}...`, "success");

                    document.getElementById('mobile-view').classList.remove('hidden');
                    this.cameraMode.init(cName);
                } catch (error) {
                    this.showToast("Ошибка соединения.", "error");
                }
            },

            // ==========================================
            // КАМЕРА (ИСТОЧНИК)
            // ==========================================
            cameraMode: {
                stream: null, peerConnection: null, wakeLock: null,
                camRef: null,

                async init(initialName) {
                    try {
                        this.stream = await navigator.mediaDevices.getUserMedia({ 
                            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: true 
                        });
                        document.getElementById('local-video').srcObject = this.stream;
                        document.getElementById('mobile-cam-name').value = initialName;
                        
                        this.camRef = doc(db, `rooms/${app.roomId}/cameras`, app.userId);
                        await setDoc(this.camRef, {
                            id: app.userId, name: initialName, status: 'online', timestamp: Date.now()
                        });

                        this.listenForViewer();
                        this.listenForGlobalCommands();
                        this.listenForNameUpdates(); // Слушаем изменения имени извне
                    } catch (e) {
                        app.showToast("Нет доступа к камере или микрофону.", "error");
                    }
                },

                async renameCamera(newName) {
                    const name = newName.trim();
                    if(!name) return;
                    if(this.camRef) {
                        try {
                            await updateDoc(this.camRef, { name: name });
                            app.showToast("Имя камеры обновлено", "success");
                        } catch(e) {}
                    }
                },

                listenForNameUpdates() {
                    onSnapshot(this.camRef, (snap) => {
                        if (snap.exists()) {
                            const dbName = snap.data().name;
                            const input = document.getElementById('mobile-cam-name');
                            // Обновляем инпут только если мы сейчас в нем не печатаем
                            if (dbName && document.activeElement !== input) {
                                input.value = dbName;
                            }
                        }
                    });
                },

                listenForViewer() {
                    const viewerCandidatesCol = collection(this.camRef, "viewerCandidates");
                    const cameraCandidatesCol = collection(this.camRef, "cameraCandidates");

                    onSnapshot(this.camRef, async (snap) => {
                        try {
                            const data = snap.data();
                            if (!data || !data.offer || this.peerConnection) return;

                            this.peerConnection = new RTCPeerConnection(rtcConfig);
                            this.stream.getTracks().forEach(track => this.peerConnection.addTrack(track, this.stream));

                            this.peerConnection.onicecandidate = async (event) => {
                                if (event.candidate) await addDoc(cameraCandidatesCol, event.candidate.toJSON());
                            };

                            this.peerConnection.onconnectionstatechange = () => {
                                const state = this.peerConnection.connectionState;
                                const badge = document.getElementById('cam-status');
                                
                                if (state === 'connected') {
                                    badge.innerHTML = `<div class="status-dot dot-live" style="background:var(--success)"></div> Соединение установлено`;
                                } else if (state === 'disconnected' || state === 'failed') {
                                    badge.innerHTML = `<div class="status-dot"></div> Отключено`;
                                    this.peerConnection = null;
                                    updateDoc(this.camRef, { offer: null, answer: null }).catch(()=>{});
                                }
                            };

                            onSnapshot(viewerCandidatesCol, (snapshot) => {
                                snapshot.docChanges().forEach(async (change) => {
                                    if (change.type === "added") {
                                        try { await this.peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data())); } catch(e) {}
                                    }
                                });
                            });

                            await this.peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                            const answer = await this.peerConnection.createAnswer();
                            await this.peerConnection.setLocalDescription(answer);
                            await updateDoc(this.camRef, { answer: { type: answer.type, sdp: answer.sdp } });
                        } catch (err) {}
                    });
                },

                listenForGlobalCommands() {
                    onSnapshot(doc(db, "rooms", app.roomId), (snap) => {
                        if (!snap.exists()) {
                            app.showToast("Сеанс закрыт режиссером.", "info");
                            setTimeout(() => window.location.reload(), 2000);
                            return;
                        }
                        const data = snap.data();
                        if (data && data.globalCommand) {
                            if (data.globalCommand.action === 'record') document.getElementById('rec-indicator').classList.remove('hidden');
                            else if (data.globalCommand.action === 'stop_record') document.getElementById('rec-indicator').classList.add('hidden');
                        }
                    });
                },

                async toggleSleep() {
                    const overlay = document.getElementById('sleep-overlay');
                    if (overlay.classList.contains('hidden')) {
                        overlay.classList.remove('hidden');
                        try { this.wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
                    } else {
                        overlay.classList.add('hidden');
                        if (this.wakeLock) { await this.wakeLock.release(); this.wakeLock = null; }
                    }
                }
            },

            // ==========================================
            // РЕЖИССЕРСКИЙ ПУЛЬТ (ПК)
            // ==========================================
            viewerMode: {
                activeConnections: {}, 
                cameraIds: [], 
                camNames: {}, 
                activeCamId: null, 
                
                audioCtx: null, audioDest: null, audioSources: {},
                masterRecorder: null, recordedChunks: [], isRecording: false,

                init() {
                    try {
                        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        this.audioDest = this.audioCtx.createMediaStreamDestination();
                    } catch (e) {
                        app.showToast("Звуковой микшер не поддерживается браузером.", "error");
                    }
                    
                    this.listenForCameras();
                    this.setupKeyboardSwitching();
                    this.startStudioRenderLoop();
                },

                listenForCameras() {
                    const camerasRef = collection(db, `rooms/${app.roomId}/cameras`);
                    onSnapshot(camerasRef, (snapshot) => {
                        snapshot.docChanges().forEach((change) => {
                            const camData = change.doc.data();
                            const camId = camData.id;

                            if (change.type === "added") {
                                this.cameraIds.push(camId);
                                this.camNames[camId] = camData.name; 
                                this.renderCameraCard(camData);
                                this.connectToCamera(camId);
                                this.updateCameraNumbers(); 
                                
                                if (!this.activeCamId) this.switchCamera(camId);
                            }
                            if (change.type === "modified") {
                                // Синхронизация имени, если его поменяли с телефона
                                this.camNames[camId] = camData.name;
                                const inputEl = document.getElementById(`name-${camId}`);
                                if (inputEl && document.activeElement !== inputEl) {
                                    inputEl.value = camData.name;
                                }
                            }
                            if (change.type === "removed") {
                                const disconnectedName = this.camNames[camId] || "Неизвестная камера";
                                app.showToast(`Источник отключен: ${disconnectedName}`, "error");

                                this.cameraIds = this.cameraIds.filter(id => id !== camId);
                                delete this.camNames[camId];
                                document.getElementById(`cam-card-${camId}`)?.remove();
                                
                                if(this.activeConnections[camId]) this.activeConnections[camId].close();
                                if(this.audioSources[camId]) this.audioSources[camId].disconnect();
                                
                                this.updateCameraNumbers(); 
                                
                                if (this.activeCamId === camId) {
                                    this.switchCamera(this.cameraIds.length > 0 ? this.cameraIds[0] : null);
                                }
                            }
                        });
                    });
                },

                updateCameraNumbers() {
                    this.cameraIds.forEach((id, index) => {
                        const badge = document.getElementById(`hotkey-${id}`);
                        if (badge) badge.innerText = index < 9 ? (index + 1) : '-';
                    });
                },

                renderCameraCard(camData) {
                    const grid = document.getElementById('cameras-grid');
                    const card = document.createElement('div');
                    card.className = 'cam-card';
                    card.id = `cam-card-${camData.id}`;
                    card.onclick = () => this.switchCamera(camData.id); 
                    
                    card.innerHTML = `
                        <div class="hotkey-badge" id="hotkey-${camData.id}">-</div>
                        <div class="cam-feed">
                            <video id="video-${camData.id}" autoplay playsinline muted></video>
                            <div id="loader-${camData.id}" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color: var(--text-muted); font-size:0.75rem;">Синхронизация...</div>
                        </div>
                        <div class="cam-info">
                            <input type="text" id="name-${camData.id}" class="editable-cam-name" value="${camData.name}"
                                   onclick="event.stopPropagation()"
                                   onblur="app.viewerMode.renameCamera('${camData.id}', this.value)"
                                   onkeydown="if(event.key==='Enter') this.blur()">
                        </div>
                    `;
                    grid.appendChild(card);
                },

                async renameCamera(camId, newName) {
                    const name = newName.trim();
                    if(!name) return;
                    try {
                        await updateDoc(doc(db, `rooms/${app.roomId}/cameras`, camId), { name: name });
                    } catch(e) {}
                },

                async connectToCamera(camId) {
                    try {
                        const pc = new RTCPeerConnection(rtcConfig);
                        this.activeConnections[camId] = pc;
                        const signalRef = doc(db, `rooms/${app.roomId}/cameras`, camId);

                        pc.ontrack = (event) => {
                            const videoEl = document.getElementById(`video-${camId}`);
                            if (videoEl) {
                                if (!videoEl.srcObject) videoEl.srcObject = new MediaStream();
                                videoEl.srcObject.addTrack(event.track);
                                document.getElementById(`loader-${camId}`).style.display = 'none';
                                
                                if (event.track.kind === 'audio' && this.audioCtx) {
                                    const source = this.audioCtx.createMediaStreamSource(new MediaStream([event.track]));
                                    this.audioSources[camId] = source;
                                    if (this.activeCamId === camId) source.connect(this.audioDest);
                                }
                            }
                        };

                        const offer = await pc.createOffer({ offerToReceiveVideo: true, offerToReceiveAudio: true });
                        await pc.setLocalDescription(offer);
                        await updateDoc(signalRef, { offer: { type: offer.type, sdp: offer.sdp }, answer: null });

                        pc.onicecandidate = async (event) => {
                            if (event.candidate) await addDoc(collection(signalRef, "viewerCandidates"), event.candidate.toJSON());
                        };

                        onSnapshot(signalRef, async (snap) => {
                            const data = snap.data();
                            if (data?.answer && pc.signalingState !== "stable") {
                                try { await pc.setRemoteDescription(new RTCSessionDescription(data.answer)); } catch(e){}
                            }
                        });

                        onSnapshot(collection(signalRef, "cameraCandidates"), (snapshot) => {
                            snapshot.docChanges().forEach(async (change) => {
                                if (change.type === "added") {
                                    try { await pc.addIceCandidate(new RTCIceCandidate(change.doc.data())); } catch(e) {}
                                }
                            });
                        });
                    } catch (err) {}
                },

                switchCamera(camId) {
                    if (this.activeCamId && this.audioSources[this.activeCamId] && this.audioDest) {
                        try { this.audioSources[this.activeCamId].disconnect(this.audioDest); } catch(e){}
                        document.getElementById(`cam-card-${this.activeCamId}`)?.classList.remove('active');
                    }

                    this.activeCamId = camId;

                    if (this.activeCamId) {
                        if (this.audioSources[this.activeCamId] && this.audioDest) {
                            this.audioSources[this.activeCamId].connect(this.audioDest);
                        }
                        document.getElementById(`cam-card-${this.activeCamId}`)?.classList.add('active');
                        document.getElementById('live-badge').innerText = `ПРОГРАММА (Эфир)`;
                        document.getElementById('live-badge').className = "monitor-label label-live";
                    } else {
                        document.getElementById('live-badge').innerText = `ПРОГРАММА (Ожидание)`;
                        document.getElementById('live-badge').className = "monitor-label label-program";
                    }
                },

                setupKeyboardSwitching() {
                    document.addEventListener('keydown', (e) => {
                        if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                        if (e.key === 'Tab' && this.cameraIds.length > 0) {
                            e.preventDefault(); 
                            const currentIndex = this.cameraIds.indexOf(this.activeCamId);
                            const nextIndex = (currentIndex + 1) % this.cameraIds.length;
                            this.switchCamera(this.cameraIds[nextIndex]);
                            return;
                        }

                        const keyNum = parseInt(e.key);
                        if (!isNaN(keyNum) && keyNum >= 1 && keyNum <= 9) {
                            const index = keyNum - 1; 
                            if (index < this.cameraIds.length) {
                                this.switchCamera(this.cameraIds[index]);
                            }
                        }
                    });
                },

                startStudioRenderLoop() {
                    const canvas = document.getElementById('program-canvas');
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');
                    
                    const render = () => {
                        ctx.fillStyle = '#09090b'; 
                        ctx.fillRect(0, 0, canvas.width, canvas.height);

                        if (this.activeCamId) {
                            const video = document.getElementById(`video-${this.activeCamId}`);
                            if (video && video.readyState >= 2) {
                                const hRatio = canvas.width / video.videoWidth;
                                const vRatio = canvas.height / video.videoHeight;
                                const ratio  = Math.min(hRatio, vRatio);
                                
                                const centerShift_x = (canvas.width - video.videoWidth*ratio) / 2;
                                const centerShift_y = (canvas.height - video.videoHeight*ratio) / 2;  
                                
                                ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight,
                                              centerShift_x, centerShift_y, video.videoWidth*ratio, video.videoHeight*ratio);
                            }
                        } else {
                            ctx.fillStyle = '#1e1e24';
                            ctx.font = '24px Inter';
                            ctx.textAlign = 'center';
                            ctx.fillText('СИГНАЛ ОТСУТСТВУЕТ', canvas.width/2, canvas.height/2);
                        }
                        requestAnimationFrame(render);
                    };
                    render();
                },

                async toggleMasterRecord() {
                    try {
                        if (this.audioCtx && this.audioCtx.state === 'suspended') await this.audioCtx.resume();
                        const btn = document.getElementById('btn-record-mix');

                        if (!this.isRecording) {
                            const canvas = document.getElementById('program-canvas');
                            const canvasStream = canvas.captureStream(30);
                            
                            const audioTracks = this.audioDest ? this.audioDest.stream.getAudioTracks() : [];
                            const tracks = [...canvasStream.getVideoTracks(), ...audioTracks];
                            const masterStream = new MediaStream(tracks);

                            this.masterRecorder = new MediaRecorder(masterStream, { mimeType: 'video/webm' });
                            this.recordedChunks = [];
                            
                            this.masterRecorder.ondataavailable = e => { if (e.data.size > 0) this.recordedChunks.push(e.data); };
                            this.masterRecorder.onstop = () => this.saveMasterRecording();
                            
                            this.masterRecorder.start();
                            this.isRecording = true;
                            
                            await updateDoc(doc(db, "rooms", app.roomId), { globalCommand: { action: 'record', ts: Date.now() } });
                            
                            btn.innerHTML = `<svg class="icon"><rect x="6" y="6" width="12" height="12"/></svg> Завершить запись`;
                            btn.className = 'btn-danger';
                            app.showToast("Студийная запись начата", "success");
                            
                        } else {
                            this.masterRecorder.stop();
                            this.isRecording = false;
                            
                            await updateDoc(doc(db, "rooms", app.roomId), { globalCommand: { action: 'stop_record', ts: Date.now() } });
                            
                            btn.innerHTML = `<svg class="icon"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg> Записать Эфир`;
                            btn.className = 'btn-primary';
                            app.showToast("Запись завершена, формируется файл...", "info");
                        }
                    } catch (err) {
                        app.showToast("Не удалось запустить запись.", "error");
                    }
                },

                saveMasterRecording() {
                    const blob = new Blob(this.recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const list = document.getElementById('recordings-list');
                    
                    if (list.innerHTML.includes('Нет доступных записей')) list.innerHTML = '';

                    const time = new Date().toLocaleTimeString();
                    
                    list.innerHTML += `
                        <div class="record-item">
                            <div class="record-meta">
                                <span class="record-title"><svg class="icon" style="color:var(--accent)"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg> Мастер-Трек</span>
                                <span class="record-time">${time}</span>
                            </div>
                            <a href="${url}" download="Broadcast_${Date.now()}.webm">Скачать файл (.webm)</a>
                        </div>
                    `;
                },

                async deleteRoom() {
                    if (!confirm("Завершить текущий сеанс? Все источники будут отключены.")) return;
                    
                    const roomRef = doc(db, "rooms", app.roomId);
                    const camerasRef = collection(db, `rooms/${app.roomId}/cameras`);
                    try {
                        const camSnapshot = await getDocs(camerasRef);
                        for (const docSnap of camSnapshot.docs) {
                            const camId = docSnap.id;
                            const clearCol = async (path) => {
                                const colSnap = await getDocs(collection(db, path));
                                colSnap.forEach(d => deleteDoc(d.ref).catch(()=>{}));
                            };
                            await clearCol(`rooms/${app.roomId}/cameras/${camId}/viewerCandidates`);
                            await clearCol(`rooms/${app.roomId}/cameras/${camId}/cameraCandidates`);
                            await deleteDoc(docSnap.ref).catch(()=>{});
                        }
                        await deleteDoc(roomRef);
                        app.showToast("Сеанс успешно закрыт.", "success");
                        setTimeout(() => window.location.reload(), 1500);
                    } catch (e) { 
                        app.showToast("Ошибка при завершении сеанса.", "error"); 
                    }
                }
            }
        };

        window.app = app;
    </script>
</body>
</html>
